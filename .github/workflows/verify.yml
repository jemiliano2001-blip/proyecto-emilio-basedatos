name: Verificación
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # Bloquea por lo que se despliega. Las de desarrollo (Tailwind 3 y el plugin de
      # ESLint de Next arrastran braces, sin versión corregida) solo se reportan.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --audit-level=moderate || echo "::warning::npm audit reporta vulnerabilidades en dependencias de desarrollo"
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
